
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>My Task Manager</h1>
        <p>Manage your daily tasks with Flask.</p>

        <form action="{{ url_for('add_task') }}" method="POST">
            <input type="text" name="task" placeholder="Enter a task" required>
            <button type="submit">Add Task</button>
        </form>

        <ul>
            {% for task in tasks %}
                <li>
                    <span class="{{ 'completed' if task.done else '' }}">
                        {{ task.name }}
                    </span>

                    {% if not task.done %}
                        <form action="{{ url_for('complete_task', task_id=loop.index0) }}" method="POST">
                            <button type="submit">Complete</button>
                        </form>
                    {% endif %}
                </li>
            {% else %}
                <li>No tasks yet. Add your first task!</li>
            {% endfor %}
        </ul>
    </main>
</body>
</html>
